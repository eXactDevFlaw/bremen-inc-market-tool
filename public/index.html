<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>BREMEN INC. // MARKET UPLINK</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
</head>
<body>
<div class="starfield" aria-hidden="true"></div>
<div class="scanlines" aria-hidden="true"></div>

<header>
  <div class="brand">
    <span class="brand-mark">◈</span>
    <div>
      <h1>BREMEN INC.</h1>
      <p class="brand-sub">MARKET UPLINK &mdash; NEW EDEN TRADE INTELLIGENCE</p>
    </div>
  </div>
  <div class="header-controls">
    <img id="headerPortrait" class="header-portrait hidden" alt="" onerror="this.classList.add('hidden')" />
    <div class="select-wrap">
      <select id="characterSelect"></select>
    </div>
    <div class="select-wrap lang-select-wrap">
      <select id="langSelect" title="Language / Sprache">
        <option value="en">EN</option>
        <option value="de">DE</option>
      </select>
    </div>
    <a href="/auth/login" class="btn btn-primary" data-i18n="common.connectCharacter"></a>
  </div>
</header>

<main>
  <nav class="tabs">
    <button data-tab="overview" class="tab active"><span class="tab-index">00</span> <span data-i18n="nav.overview"></span></button>
    <button data-tab="skills" class="tab"><span class="tab-index">01</span> <span data-i18n="nav.skills"></span></button>
    <button data-tab="assets" class="tab"><span class="tab-index">02</span> <span data-i18n="nav.assets"></span></button>
    <button data-tab="trading" class="tab"><span class="tab-index">03</span> <span data-i18n="nav.trading"></span></button>
    <button data-tab="market" class="tab"><span class="tab-index">04</span> <span data-i18n="nav.market"></span></button>
    <button data-tab="industry" class="tab"><span class="tab-index">05</span> <span data-i18n="nav.industry"></span></button>
    <button data-tab="settings" class="tab"><span class="tab-index">06</span> <span data-i18n="nav.settings"></span></button>
  </nav>

  <div id="setupBanner" class="setup-banner hidden">
    <span data-i18n="banner.setupClientIdPrefix"></span>
    <button class="link-btn" data-goto="settings" data-i18n="nav.settings"></button><span data-i18n="banner.setupClientIdSuffix"></span>
  </div>
  <div id="rescopeBanner" class="setup-banner hidden">
    <span data-i18n="banner.rescopePrefix"></span> <b data-i18n="banner.rescopeBold"></b>. <span data-i18n="banner.rescopeSuffix"></span>
  </div>

  <section id="tab-overview" class="panel">
    <div class="panel-corner tl"></div><div class="panel-corner tr"></div>
    <div class="panel-corner bl"></div><div class="panel-corner br"></div>
    <h2 data-i18n="overview.title"></h2>
    <p class="panel-desc" data-i18n="overview.desc"></p>
    <div id="overviewContent" class="empty" data-i18n="common.noCharacterConnected"></div>
  </section>

  <section id="tab-skills" class="panel hidden">
    <div class="panel-corner tl"></div><div class="panel-corner tr"></div>
    <div class="panel-corner bl"></div><div class="panel-corner br"></div>
    <h2 data-i18n="skills.title"></h2>
    <div id="skillsContent" class="empty" data-i18n="common.chooseCharacterFirst"></div>
  </section>

  <section id="tab-assets" class="panel hidden">
    <div class="panel-corner tl"></div><div class="panel-corner tr"></div>
    <div class="panel-corner bl"></div><div class="panel-corner br"></div>
    <h2 data-i18n="assets.title"></h2>
    <p class="panel-desc" data-i18n="assets.desc"></p>
    <div id="assetsContent" class="empty" data-i18n="common.chooseCharacterFirst"></div>
  </section>

  <section id="tab-trading" class="panel hidden">
    <div class="panel-corner tl"></div><div class="panel-corner tr"></div>
    <div class="panel-corner bl"></div><div class="panel-corner br"></div>
    <h2 data-i18n="trading.title"></h2>
    <p class="panel-desc" data-i18n-html="trading.descHtml"></p>

    <div class="mode-switch">
      <button class="mode-btn active" data-mode="five_hub" data-i18n="trading.modeFiveHub"></button>
      <button class="mode-btn" data-mode="custom" data-i18n="trading.modeCustom"></button>
    </div>

    <div id="customLocationPicker" class="location-picker hidden">
      <div class="autocomplete">
        <input id="locationSearchInput" type="text" data-i18n-placeholder="trading.locationPlaceholder" autocomplete="off" />
        <div id="locationSearchResults" class="autocomplete-results hidden"></div>
      </div>
      <div id="selectedLocation" class="selected-location hidden"></div>
    </div>

    <p id="fullMarketHint" class="muted small-text" data-i18n="trading.fullMarketHint"></p>
    <button id="runAnalysis" class="btn btn-primary" data-i18n="trading.run"></button>
    <div id="tradingContent"></div>
    <div id="aiAnalysisSection" class="ai-analysis-section hidden">
      <button id="runAiAnalysis" class="btn" data-i18n="trading.aiAnalysisRun"></button>
      <div id="aiAnalysisContent"></div>
    </div>
  </section>

  <section id="tab-market" class="panel hidden">
    <div class="panel-corner tl"></div><div class="panel-corner tr"></div>
    <div class="panel-corner bl"></div><div class="panel-corner br"></div>
    <h2 data-i18n="market.title"></h2>
    <p class="panel-desc" data-i18n="market.desc"></p>

    <div class="mode-switch">
      <button class="mode-btn active" data-market-view="history" data-i18n="market.subnavHistory"></button>
      <button class="mode-btn" data-market-view="route" data-i18n="market.subnavRoute"></button>
    </div>

    <div id="marketHistoryView" class="market-view">
      <div class="market-controls">
        <div class="autocomplete">
          <input id="historyItemInput" type="text" data-i18n-placeholder="market.itemPlaceholder" autocomplete="off" />
          <div id="historyItemResults" class="autocomplete-results hidden"></div>
        </div>
        <div class="hub-quickpicks" id="historyHubQuickpicks"></div>
        <div class="autocomplete">
          <input id="historyLocationInput" type="text" data-i18n-placeholder="trading.locationPlaceholder" autocomplete="off" />
          <div id="historyLocationResults" class="autocomplete-results hidden"></div>
        </div>
        <select id="historyDaysSelect" class="days-select">
          <option value="30">30d</option>
          <option value="90" selected>90d</option>
          <option value="180">180d</option>
          <option value="365">365d</option>
        </select>
      </div>
      <div id="historySelectedInfo" class="selected-location hidden"></div>
      <div id="historyChartContent"><div class="empty" data-i18n="market.chooseItem"></div></div>
    </div>

    <div id="marketRouteView" class="market-view hidden">
      <div class="route-locations">
        <div class="route-location-block">
          <h3 class="section-label" data-i18n="market.routeFrom"></h3>
          <div class="hub-quickpicks" id="routeFromHubQuickpicks"></div>
          <div class="autocomplete">
            <input id="routeFromInput" type="text" data-i18n-placeholder="trading.locationPlaceholder" autocomplete="off" />
            <div id="routeFromResults" class="autocomplete-results hidden"></div>
          </div>
          <div id="routeFromSelected" class="selected-location hidden"></div>
        </div>
        <div class="route-arrow" aria-hidden="true">→</div>
        <div class="route-location-block">
          <h3 class="section-label" data-i18n="market.routeTo"></h3>
          <div class="hub-quickpicks" id="routeToHubQuickpicks"></div>
          <div class="autocomplete">
            <input id="routeToInput" type="text" data-i18n-placeholder="trading.locationPlaceholder" autocomplete="off" />
            <div id="routeToResults" class="autocomplete-results hidden"></div>
          </div>
          <div id="routeToSelected" class="selected-location hidden"></div>
        </div>
      </div>
      <div class="autocomplete">
        <input id="routeItemInput" type="text" data-i18n-placeholder="market.routeItemOptional" autocomplete="off" />
        <div id="routeItemResults" class="autocomplete-results hidden"></div>
      </div>
      <div id="routeItemSelected" class="selected-location hidden"></div>
      <button id="runRoute" class="btn btn-primary" data-i18n="market.routeRun"></button>
      <div id="routeContent"></div>
    </div>
  </section>

  <section id="tab-industry" class="panel hidden">
    <div class="panel-corner tl"></div><div class="panel-corner tr"></div>
    <div class="panel-corner bl"></div><div class="panel-corner br"></div>
    <h2 data-i18n="industry.title"></h2>
    <p class="panel-desc" data-i18n-html="industry.descHtml"></p>

    <h3 class="section-label" data-i18n="industry.costIndexHeading"></h3>
    <div class="autocomplete">
      <input id="industryLocationSearchInput" type="text" data-i18n-placeholder="industry.addLocationPlaceholder" autocomplete="off" />
      <div id="industryLocationSearchResults" class="autocomplete-results hidden"></div>
    </div>
    <div id="costIndexContent" class="empty">// ...</div>

    <h3 class="section-label" data-i18n="industry.blueprintsHeading"></h3>
    <div id="blueprintsContent" class="empty" data-i18n="common.chooseCharacterFirst"></div>

    <h3 class="section-label" data-i18n="industry.ownStructureHeading"></h3>
    <div class="category-block">
      <p class="panel-desc" data-i18n="industry.ownStructureText"></p>
    </div>
  </section>

  <section id="tab-settings" class="panel hidden">
    <div class="panel-corner tl"></div><div class="panel-corner tr"></div>
    <div class="panel-corner bl"></div><div class="panel-corner br"></div>
    <h2 data-i18n="settings.title"></h2>

    <h3 class="section-label" data-i18n="settings.langHeading"></h3>
    <div class="settings-row">
      <select id="settingsLangSelect">
        <option value="en">English</option>
        <option value="de">Deutsch</option>
      </select>
    </div>

    <h3 class="section-label" data-i18n="settings.anthropicHeading"></h3>
    <p class="panel-desc" data-i18n="settings.anthropicText"></p>
    <div class="settings-row">
      <input id="anthropicKeyInput" type="password" placeholder="sk-ant-... (optional)" autocomplete="off" />
      <span id="anthropicKeyStatus" class="status-tag"></span>
    </div>

    <h3 class="section-label" data-i18n="settings.groqHeading"></h3>
    <p class="panel-desc" data-i18n-html="settings.groqTextHtml"></p>
    <div class="settings-row">
      <input id="groqKeyInput" type="password" placeholder="gsk_... (optional)" autocomplete="off" />
      <span id="groqKeyStatus" class="status-tag"></span>
    </div>

    <h3 class="section-label" data-i18n="settings.eveHeading"></h3>
    <p class="panel-desc" data-i18n="settings.eveText"></p>
    <div class="settings-row">
      <input id="eveClientIdInput" type="text" placeholder="(optional)" autocomplete="off" />
      <span id="eveClientIdStatus" class="status-tag"></span>
    </div>

    <button id="saveSettings" class="btn btn-primary" style="margin-top:1.2rem;" data-i18n="settings.save"></button>
    <span id="settingsSaveResult" class="muted" style="margin-left:0.8rem;"></span>
  </section>
</main>

<script type="module" src="js/main.js"></script>
</body>
</html>
